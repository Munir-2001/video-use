<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
:root { --ink:#141418; --muted:#6E6A64; --line:#DCD6CA; --paper:#F3EEE4; --flame:#F4502A; --cobalt:#1F5BFF; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
#root { position:relative; width:1080px; height:1920px; background:transparent; font-family:"Inter",sans-serif; color:var(--ink); }
.abs { position:absolute; }
#panel { left:0; top:0; width:1080px; height:960px; background-color:var(--paper);
  background-image:radial-gradient(circle at 14px 14px, rgba(20,20,24,.06) 0 1.5px, rgba(20,20,24,0) 1.7px); background-size:28px 28px; }
#wrap { position:absolute; left:48px; top:192px; width:892px; height:640px; transform-origin:50% 50%; }
.win { position:absolute; inset:0; background:#fff; border:1px solid var(--line); border-radius:24px; overflow:hidden; box-shadow:0 18px 40px rgba(20,20,24,.16); }
.chrome { position:absolute; left:0; top:0; width:892px; height:48px; border-bottom:1px solid var(--line); background:#fff; }
.chrome i { position:absolute; top:19px; width:10px; height:10px; border-radius:5px; background:var(--line); }
.chrome span { position:absolute; left:96px; top:0; font:500 28px/48px "JetBrains Mono"; color:var(--muted); white-space:pre; }
.cont { position:absolute; left:0; top:48px; width:892px; height:590px; overflow:hidden; }
#spin { left:24px; top:24px; width:28px; height:28px; border-radius:14px; border:4px solid var(--line); border-top-color:var(--flame); }
#check { left:24px; top:24px; width:28px; height:28px; border-radius:14px; background:var(--flame); opacity:0; }
#check svg { position:absolute; left:6px; top:7px; }
#tool { left:68px; top:20px; font:500 28px/36px "JetBrains Mono"; color:var(--muted); white-space:pre; }
#css { left:24px; top:76px; font:500 28px/36px "JetBrains Mono"; color:var(--muted); white-space:pre; }
#css b { font-weight:500; color:var(--cobalt); }
.hr { left:24px; width:844px; height:1px; background:var(--line); transform-origin:0 0; }
.vr { top:190px; width:1px; height:300px; background:var(--line); transform-origin:0 0; }
.band { top:190px; height:300px; background:rgba(244,80,42,.12); transform-origin:50% 0; opacity:0; }
.band::before { content:""; position:absolute; left:0; right:0; top:0; height:3px; background:var(--flame); }
.hd { top:190px; height:48px; font:500 28px/48px "JetBrains Mono"; color:var(--muted); opacity:0; white-space:nowrap; }
.cell { height:84px; font:600 28px/84px "Inter"; color:var(--ink); opacity:0; white-space:nowrap; }
#ptr { left:0; top:0; width:36px; height:36px; }
#ptrIn { position:absolute; inset:0; filter:drop-shadow(0 3px 4px rgba(20,20,24,.3)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.24" data-width="1080" data-height="1920">
  <div id="panel" class="abs"></div>
  <div id="wrap" class="clip" data-start="0" data-duration="4.24" data-track-index="2">
    <div class="win">
      <div class="chrome"><i style="left:20px"></i><i style="left:42px"></i><i style="left:64px"></i><span>claude  ·  demo-folder</span></div>
      <div class="cont">
        <div id="spin" class="abs"></div>
        <div id="check" class="abs"><svg width="16" height="14" viewBox="0 0 22 20" fill="none" stroke="#F3EEE4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5l6 6L19 3.5"/></svg></div>
        <div id="tool" class="abs">scrapling  fetch(directory.example/companies)</div>
        <div id="css" class="abs">css: <b>"div.listing &gt; a[href^='mailto:']"</b></div>

        <div class="abs band" id="b1" style="left:24px;width:170px"></div>
        <div class="abs band" id="b2" style="left:194px;width:290px"></div>
        <div class="abs band" id="b3" style="left:484px;width:384px"></div>

        <div class="abs hr" style="top:190px"></div>
        <div class="abs hr" style="top:238px"></div>
        <div class="abs hr" style="top:322px"></div>
        <div class="abs hr" style="top:406px"></div>
        <div class="abs hr" style="top:490px"></div>
        <div class="abs vr" style="left:24px"></div>
        <div class="abs vr" style="left:194px"></div>
        <div class="abs vr" style="left:484px"></div>
        <div class="abs vr" style="left:868px"></div>

        <div class="abs hd c1" style="left:40px">name</div>
        <div class="abs hd c2" style="left:210px">site</div>
        <div class="abs hd c3" style="left:500px">email</div>
        <div class="abs cell c1" style="left:40px;top:238px">Acme Co</div>
        <div class="abs cell c1" style="left:40px;top:322px">Birch Labs</div>
        <div class="abs cell c1" style="left:40px;top:406px">Cedar &amp; Co</div>
        <div class="abs cell c2" style="left:210px;top:238px">acme.example</div>
        <div class="abs cell c2" style="left:210px;top:322px">birchlabs.example</div>
        <div class="abs cell c2" style="left:210px;top:406px">cedar.example</div>
        <div class="abs cell c3" style="left:500px;top:238px">hello@acme.example</div>
        <div class="abs cell c3" style="left:500px;top:322px">info@birchlabs.example</div>
        <div class="abs cell c3" style="left:500px;top:406px">team@cedar.example</div>
      </div>
    </div>
    <div id="ptr" class="abs"><div id="ptrIn"><svg width="36" height="36" viewBox="0 0 36 36"><path d="M5 3 L5 28 L11.5 22.5 L16 32 L21 29.8 L16.6 20.8 L25 20.2 Z" fill="#141418" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg></div></div>
  </div>
<script>
const OUT = "power3.out", IN = "power3.in", IO = "power3.inOut";
const tl = gsap.timeline({ paused: true });
const FLAME = "#F4502A", MUTED = "#6E6A64";
const ok = document.fonts.check('800 28px "Inter"') && document.fonts.check('500 28px "JetBrains Mono"');
console.log("fonts loaded:", ok);
// clip time = output time - 29.74
// continuous drift of the window, never stops
tl.fromTo("#wrap", { y: 0, scale: 1 }, { y: -8, scale: 1.02, duration: 4.24, ease: "sine.inOut" }, 0);
// spinner: the only change until "table"
tl.fromTo("#spin", { rotation: 0 }, { rotation: 720, duration: 1.4, ease: "none" }, 0);
// pointer: park beside the tool line, travel beside table by 1.20, then beside each header 200 ms before its word
gsap.set("#ptr", { x: 780, y: 118 });
gsap.set(".hr", { scaleX: 0 }); gsap.set(".vr, .band", { scaleY: 0 });
tl.to("#ptr", { x: 200, y: 192, duration: 0.3, ease: IO }, 0.90);
tl.to("#ptr", { x: 90, y: 192, duration: 0.3, ease: IO }, 1.62);
tl.to("#ptr", { x: 260, y: 192, duration: 0.3, ease: IO }, 2.34);
tl.to("#ptr", { x: 550, y: 192, duration: 0.3, ease: IO }, 3.06);
tl.fromTo("#ptrIn", { x: -2, y: -1 }, { x: 2, y: 1, duration: 0.5, ease: "sine.inOut", repeat: 7, yoyo: true }, 0);
// "table" (clip 1.40): change starts 120 ms early at 1.28
tl.to("#spin", { opacity: 0, duration: 0.12, ease: OUT }, 1.28);
tl.fromTo("#check", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.17, ease: OUT }, 1.28);
tl.to(".hr", { scaleX: 1, duration: 0.25, ease: OUT }, 1.28);
tl.to(".vr", { scaleY: 1, duration: 0.25, ease: OUT }, 1.28);
// columns: words at 2.12 / 2.84 / 3.56, start 120 ms early
[["b1", ".c1", 2.00], ["b2", ".c2", 2.72], ["b3", ".c3", 3.44]].forEach(([b, c, t0]) => {
  tl.set("#" + b, { opacity: 1 }, t0);
  tl.to("#" + b, { scaleY: 1, duration: 0.25, ease: OUT }, t0);
  document.querySelectorAll(c).forEach((el, i) =>
    tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.17, ease: OUT }, t0 + i * 0.06));
  tl.to("#" + b, { opacity: 0, duration: 0.125, ease: IN }, t0 + 0.6);
});
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</div>
</body>
</html>
