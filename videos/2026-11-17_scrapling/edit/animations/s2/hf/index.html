<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
:root { --ink:#141418; --muted:#6E6A64; --line:#DCD6CA; --paper:#F3EEE4; --flame:#F4502A; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
#root { position:relative; width:1080px; height:1920px; background:transparent; font-family:"Inter",sans-serif; color:var(--ink); }
.abs { position:absolute; }
#panel { left:0; top:0; width:1080px; height:960px; background-color:var(--paper);
  background-image:radial-gradient(circle at 14px 14px, rgba(20,20,24,.06) 0 1.5px, rgba(20,20,24,0) 1.7px); background-size:28px 28px; }
#slide { position:absolute; left:0; top:0; width:1080px; height:960px; }
#drift { position:absolute; left:0; top:0; width:1080px; height:960px; transform-origin:494px 512px; }
#win { position:absolute; left:48px; top:192px; width:892px; height:640px; background:#fff; border:1px solid var(--line); border-radius:24px; overflow:hidden; box-shadow:0 18px 40px rgba(20,20,24,.16); }
.chrome { position:absolute; left:0; top:0; width:892px; height:48px; border-bottom:1px solid var(--line); }
.chrome i { position:absolute; top:19px; width:10px; height:10px; border-radius:5px; background:var(--line); }
.chrome span { position:absolute; left:96px; top:0; font:500 28px/48px "JetBrains Mono"; color:var(--muted); }
#title { left:48px; top:60px; height:84px; font:800 72px/84px "Inter"; white-space:pre; }
#ul { left:48px; top:140px; width:330px; height:6px; border-radius:3px; background:var(--flame); transform-origin:0 50%; }
#pill { left:404px; top:80px; width:232px; height:48px; border-radius:24px; background:var(--flame); opacity:0; font:600 28px/48px "Inter"; padding-left:22px; white-space:pre; }
#repo { left:48px; top:164px; height:32px; font:500 28px/32px "JetBrains Mono"; color:var(--muted); white-space:pre; }
.bar { position:absolute; left:48px; height:10px; border-radius:5px; background:#DCD6CA; }
.c { opacity:0; }
#ptr { position:absolute; left:0; top:0; width:30px; height:40px; filter:drop-shadow(0 4px 6px rgba(20,20,24,.3)); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3.68" data-width="1080" data-height="1920">
  <div id="panel" class="abs"></div>
  <div id="slide"><div id="drift">
    <div id="win">
      <div class="chrome"><i style="left:24px"></i><i style="left:44px"></i><i style="left:64px"></i><span>README.md</span></div>
      <div class="abs" style="left:0;top:48px;width:890px;height:590px;">
        <div id="title" class="abs"></div><div id="ul" class="abs"></div>
        <div id="pill" class="abs"></div>
        <div id="repo" class="abs"></div>
        <div class="bar" style="top:250px;width:790px"></div><div class="bar" style="top:290px;width:730px"></div>
        <div class="bar" style="top:330px;width:770px"></div><div class="bar" style="top:370px;width:440px"></div>
      </div>
    </div>
    <svg id="ptr" viewBox="0 0 30 40"><path d="M2 2 L2 31 L9 25 L14 37 L19 35 L14 23 L24 23 Z" fill="#141418" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg>
  </div></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const OUT = "power3.out", IO = "sine.inOut", IN = "power3.in";
const tl = gsap.timeline({ paused: true });
const $ = (s) => document.querySelector(s);
if (!document.fonts.check('800 72px "Inter"')) console.warn("Inter not loaded");
function build(sel, text) {
  const el = $(sel); el.textContent = "";
  return [...text].map((ch) => { const s = document.createElement("span"); s.className = "c"; s.textContent = ch; el.appendChild(s); return s; });
}
function typeSpans(spans, t0, t1) { spans.forEach((s, i) => tl.set(s, { opacity: 1 }, t0 + (t1 - t0) * (i / spans.length))); }
// clip time = output - 3.42; every change starts 120 ms before its word
tl.fromTo("#slide", { x: 1080 }, { x: 0, duration: 0.35, ease: OUT }, 0);
tl.fromTo("#drift", { y: 0, scale: 1 }, { y: -8, scale: 1.02, duration: 3.33, ease: IO, immediateRender: false }, 0.35);
gsap.set("#ptr", { x: 700, y: 760 });
tl.to("#ptr", { x: 446, y: 350, duration: 0.30, ease: "power3.inOut" }, 0.34);
tl.to("#ptr", { x: 736, y: 376, duration: 0.30, ease: "power3.inOut" }, 1.54);
tl.to("#ptr", { x: 582, y: 442, duration: 0.30, ease: "power3.inOut" }, 2.42);
typeSpans(build("#title", "Scrapling"), 0.59, 0.84);
tl.fromTo("#ul", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: OUT }, 0.84);
tl.fromTo("#pill", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.17, ease: OUT }, 1.92);
const ps = build("#pill", "open source");
typeSpans(ps.slice(0, 4), 2.00, 2.20);
typeSpans(ps.slice(4), 2.32, 2.56);
typeSpans(build("#repo", "github.com/D4Vinci/Scrapling"), 2.80, 3.44);
gsap.set("#pill", { transformOrigin: "0% 50%" });
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
